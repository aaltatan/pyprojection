site_name: pyprojection
site_description: Output shapes as values, which fields, under which names, computed how; composable with & and definable as JSON.
site_url: https://aaltatan.github.io/pyprojection/
repo_url: https://github.com/aaltatan/pyprojection
repo_name: aaltatan/pyprojection
edit_uri: edit/main/docs/
copyright: GPL-3.0-only

theme:
  name: material
  icon:
    logo: material/table-column
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

not_in_nav: |
  DESIGN.md

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Columns and registries: guide/columns.md
      - Projections and computed columns: guide/projections.md
      - Compiling projections from JSON: guide/compiling.md
      - JSON Schema: guide/json-schema.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - API: reference/api.md
      - Definition format: reference/definitions.md
      - Exceptions: reference/exceptions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/pyprojection
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyprojection/
